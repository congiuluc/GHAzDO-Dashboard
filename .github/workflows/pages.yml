name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "apps/extension/static/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version label shown in the docs header
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve version label
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          label="$INPUT_VERSION"
          if [ -z "$label" ]; then label=$(git describe --tags --abbrev=0 --match 'v*.*.*' 2>/dev/null || echo "main"); fi
          echo "label=$label" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          VITE_DOCS_VERSION: ${{ steps.version.outputs.label }}
        run: npm run build --workspace apps/docs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
