name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Comma-separated HTTPS backend origins compiled into the extension (empty = browser-only builds).
      VITE_BACKEND_ALLOWLIST: ${{ vars.VITE_BACKEND_ALLOWLIST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck, lint, test, build
        run: npm run validate

      # Bicep compilation is offline; no Azure sign-in needed.
      - name: Build Bicep
        run: |
          az bicep install
          npm run bicep:build

      - name: Package extension and functions
        run: |
          npm run package:vsix
          npm run package:functions
          cp apps/functions/functions.zip out/
          cp infra/out/main.json out/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: out/
          if-no-files-found: error
          retention-days: 14
